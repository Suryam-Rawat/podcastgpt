<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#6e675e}
  .row{display:flex;gap:24px;align-items:end;padding:24px;background:#3a342c}
  figure{margin:0;text-align:center;color:#f3eee6;font:12px sans-serif}
  img{display:block;background:#000;image-rendering:pixelated}
  img.s16{width:16px;height:16px}
  img.s32{width:32px;height:32px;image-rendering:auto}
  img.s64{width:64px;height:64px;image-rendering:auto}
  img.s180{width:180px;height:180px}
</style>
<div class="row">
  <figure><img class="s16" src="favicon.svg"><figcaption>16</figcaption></figure>
  <figure><img class="s32" src="favicon.svg"><figcaption>32</figcaption></figure>
  <figure><img class="s64" src="favicon.svg"><figcaption>64</figcaption></figure>
  <figure><img class="s180" src="favicon.svg"><figcaption>180</figcaption></figure>
</div>
